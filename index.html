<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div id="log">
        <h1>Logowanie</h1>
        <p><input id="login" type="text" placeholder="Nazwa użytkownika" autocomplete="username"></p>
        <p><input id="haslo" type="password" placeholder="Hasło" autocomplete="current-password"></p>
        <button onclick="zaloguj()">Zaloguj się</button>
        <button onclick="zarejestruj()">Załóż konto</button>
        <p id="blad"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/baza.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
